name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        toolchain: [gcc14, clang18]
        preset: [debug-asan, release]
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer apt-daily.service apt-daily-upgrade.service || true
          sudo systemctl kill --kill-who=all apt-daily.service apt-daily-upgrade.service || true
          APT_OPTS="-o DPkg::Lock::Timeout=60"
          sudo apt-get $APT_OPTS update
          if [ "${{ matrix.toolchain }}" = "gcc14" ]; then
            sudo apt-get $APT_OPTS install -y gcc-14 g++-14
          else
            sudo apt-get $APT_OPTS install -y clang-18 clang-tools-18
          fi
          sudo apt-get $APT_OPTS install -y ninja-build

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}-${{ matrix.toolchain }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}-${{ matrix.toolchain }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}-${{ matrix.toolchain }} --output-on-failure --timeout 120
