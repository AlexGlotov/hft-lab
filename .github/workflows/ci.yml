name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: [gcc14, clang18]
        preset: [debug-asan, release]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          if [ "${{ matrix.toolchain }}" = "gcc14" ]; then
            sudo apt-get install -y gcc-14 g++-14
          else
            sudo apt-get install -y clang-18 clang-tools-18
          fi
          sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}-${{ matrix.toolchain }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}-${{ matrix.toolchain }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}-${{ matrix.toolchain }} --output-on-failure
